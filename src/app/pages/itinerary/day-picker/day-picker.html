<button
  #toggle
  type="button"
  class="toggle"
  [attr.aria-expanded]="open()"
  aria-controls="day-picker-panel"
  (click)="toggleOpen()"
  (keydown.arrowdown)="openAndFocus($event)"
>
  <span class="visually-hidden">選擇日期，目前：</span>
  <span class="toggle__label">{{ currentLabel() }}</span>
  <svg
    class="toggle__icon"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
    focusable="false"
  >
    <path d="M6 9l6 6 6-6" />
  </svg>
</button>

@if (open()) {
  <ul id="day-picker-panel" class="panel" aria-label="行程日期">
    @for (option of options(); track option.day) {
      <li>
        <button
          #option
          type="button"
          class="option"
          [class.is-active]="option.day === selected()"
          [attr.aria-current]="option.day === selected() ? 'true' : null"
          (click)="choose(option.day)"
        >
          <span class="option__day">{{ option.label }}</span>
          <span class="option__title t-zh">{{ option.title }}</span>
        </button>
      </li>
    }
  </ul>
}
